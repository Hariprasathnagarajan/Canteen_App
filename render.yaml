services:
  - type: web
    name: canteen-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir canteen_backend canteen_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_HOSTS
        value: "canteen-app-l261.onrender.com,localhost,127.0.0.1,0.0.0.0,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vcafe.netlify.app,http://localhost:3000,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vcafe.netlify.app,https://canteen-app-l261.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
