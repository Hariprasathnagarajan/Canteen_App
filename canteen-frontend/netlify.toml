[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://canteen-app-l261.onrender.com/api/:splat"
  status = 200
  force = true

# SPA redirect fallback to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
