[build]
  base = "canteen-frontend"
  publish = "canteen-frontend/dist"
  command = "npm run build"

# Proxy /api requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://canteen-app-l261.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
